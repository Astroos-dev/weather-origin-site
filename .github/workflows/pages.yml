name: Publish Weather Origin legal and support website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published privacy and support pages over HTTPS
        run: |
          set -e
          for page in privacy-policy.html support.html; do
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --max-time 15 "https://astroos-dev.github.io/weather-origin-site/$page" | grep -qi "<title"; then
                echo "Verified $page"
                break
              fi
              if [ "$attempt" = 12 ]; then
                echo "Public $page not reachable"; exit 1
              fi
              sleep 10
            done
          done
